<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Flow — Zero-Friction Project &amp; Task Management</title>
  <meta name="description" content="Flow combines quick capture, Microsoft To Do style My Day planning, Trello Kanban simplicity, and lightweight Asana subtasks &amp; dependencies." />
  <meta name="theme-color" content="#2563EB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Flow" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <!-- Inter Font (Graceful system-ui / Roboto fallback when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Modular Material Minimal Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Left Navigation Sidebar (Desktop persistent 260px / Tablet drawer / Hidden on Mobile) -->
    <aside class="sidebar" id="sidebar" aria-label="Workspace Navigation">
      <div class="sidebar-header">
        <div class="brand-mark">
          <span class="brand-logo" id="brand-logo-icon"></span>
          <span>Flow</span>
        </div>
        <button type="button" class="sync-pill-btn" id="btn-sidebar-sync" title="Cross-Device GitHub Cloud Sync"></button>
      </div>

      <nav class="sidebar-scroll" id="sidebar-scroll"></nav>

      <div class="sidebar-footer">
        <button type="button" class="btn btn-secondary" style="flex:1; height:32px; font-size:12.5px" id="btn-footer-new-list">
          + New Project
        </button>
        <button type="button" class="btn btn-primary" style="height:32px; font-size:12px; padding:0 10px; display:none" id="btn-install-pwa" title="Install Flow as a standalone app">
          Install
        </button>
        <button type="button" class="icon-btn" id="btn-reset-demo" title="Reset initial demo data">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Scrim for Tablet Sidebar Drawer -->
    <div class="scrim sidebar-scrim" id="sidebar-scrim"></div>

    <!-- Main Workspace Area -->
    <main class="workspace" id="workspace">
      <header class="workspace-header" id="workspace-header">
        <div class="workspace-header-left" id="workspace-header-left"></div>
        <div class="workspace-header-right" id="workspace-header-right"></div>
      </header>

      <section class="workspace-capture-zone" id="workspace-capture-zone" aria-label="Smart Quick Capture"></section>

      <section class="workspace-body" id="workspace-body" aria-live="polite"></section>
    </main>

    <!-- Scrim for Tablet Slide-Over & Mobile Bottom Sheet -->
    <div class="scrim detail-scrim" id="detail-scrim"></div>

    <!-- Right Task Detail Drawer (Desktop 380px inline non-covering / Mobile Bottom Sheet) -->
    <aside class="detail-pane" id="detail-pane" aria-label="Task Details">
      <div class="bottom-sheet-handle-bar" id="bottom-sheet-handle" aria-hidden="true">
        <div class="bottom-sheet-pill"></div>
      </div>
      <div class="detail-pane-inner" id="detail-pane-inner"></div>
    </aside>

    <!-- Mobile Floating Action Button (< 768px) -->
    <button type="button" class="mobile-fab" id="mobile-fab" aria-label="Quick Add Task"></button>

    <!-- Persistent Mobile 4-Tab Bottom Navigation Bar (< 768px) -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile Navigation"></nav>
  </div>

  <!-- Overlays: Modals, Popover Menus, Gentle Toast Stack -->
  <div id="modal-mount"></div>
  <div id="dropdown-mount"></div>
  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <!-- Modular Application Scripts -->
  <script defer src="js/icons.js"></script>
  <script defer src="js/presets.js"></script>
  <script defer src="js/parser.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/sync.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
